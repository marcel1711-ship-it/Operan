<!DOCTYPE html>
<html>
<head>
<style>
  body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; margin: 0; background: #f8fafc; color: #1e293b; }
  .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .header h1 { font-size: 14px; font-weight: 700; margin: 0; }
  .header .logo { width: 24px; height: 24px; background: #0d9488; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold; }
  .status-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .status-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 4px 0; }
  .status-row .label { color: #64748b; }
  .status-row .value { font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-yellow { background: #fef9c3; color: #854d0e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn-primary { background: #0d9488; color: white; }
  .btn-primary:hover { background: #0f766e; }
  .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
  .result { margin-top: 12px; padding: 10px; background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 8px; font-size: 11px; color: #134e4a; }
  .result.error { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
  .footer { margin-top: 12px; font-size: 10px; color: #94a3b8; text-align: center; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">O</div>
    <h1>OPERAN TimeTree Sync</h1>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="label">Status</span>
      <span id="status" class="badge badge-gray">Checking...</span>
    </div>
    <div class="status-row">
      <span class="label">Calendar</span>
      <span id="calendar" class="value">-</span>
    </div>
    <div class="status-row">
      <span class="label">Events found</span>
      <span id="events" class="value">-</span>
    </div>
    <div class="status-row">
      <span class="label">Last sync</span>
      <span id="lastSync" class="value">Never</span>
    </div>
  </div>

  <button id="syncBtn" class="btn btn-primary" disabled>Sync Now</button>
  <div id="result" class="result" style="display:none"></div>
  <div class="footer">Auto-syncs every 5 minutes while TimeTree is open</div>

  <script src="popup.js"></script>
</body>
</html>
